include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**

linter:
  rules:
    # Este lint propone parámetros nombrados privados (`required this._campo`),
    # que no todos los analizadores (p. ej. el del IDE) aceptan todavía.
    prefer_initializing_formals: false
