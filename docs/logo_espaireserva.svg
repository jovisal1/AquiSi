<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8693f"/>
      <stop offset="1" stop-color="#c8431f"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76e"/>
      <stop offset="1" stop-color="#f6b93b"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#8a5a3c" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9dc"/>
      <stop offset="1" stop-color="#ffc9ad"/>
    </linearGradient>
    <clipPath id="arco">
      <path d="M512 520 V352 A88 88 0 0 1 688 352 V520 Z"/>
    </clipPath>
  </defs>

  <!-- Halo -->
  <circle cx="600" cy="370" r="300" fill="#fde4d8"/>
  <circle cx="600" cy="370" r="300" fill="none" stroke="#f3cdb9" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- Acentos -->
  <circle cx="852" cy="168" r="34" fill="url(#sol)"/>
  <rect x="318" y="520" width="54" height="54" rx="16" fill="#4c7fd9" transform="rotate(-14 345 547)"/>
  <path d="M858 520 l10 26 l26 10 l-26 10 l-10 26 l-10 -26 l-26 -10 l26 -10 z" fill="#1f2332"/>

  <!-- Símbolo -->
  <g filter="url(#sombra)">
    <rect x="420" y="190" width="360" height="360" rx="104" fill="url(#coral)"/>
  </g>
  <!-- Puerta en arco abierta a un amanecer -->
  <path d="M512 520 V352 A88 88 0 0 1 688 352 V520 Z" fill="url(#cielo)"/>
  <g clip-path="url(#arco)">
    <circle cx="600" cy="516" r="70" fill="url(#sol)"/>
    <circle cx="600" cy="516" r="96" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6"/>
  </g>
  <path d="M512 520 V352 A88 88 0 0 1 688 352 V520" fill="none" stroke="#ffffff" stroke-width="20" stroke-linejoin="round"/>
  <rect x="468" y="510" width="264" height="20" rx="10" fill="#ffffff"/>

  <!-- Nombre -->
  <text x="600" y="800" text-anchor="middle" font-family="Montserrat" font-size="104" fill="#1f2332" letter-spacing="-3"><tspan font-weight="700">espai</tspan><tspan font-weight="500" fill="#b23a14">reserva</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
